<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14204a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Regimon GO — a Regis High School themed catch-'em-all game on the Upper East Side.">
  <title>Regimon GO</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
  <canvas id="map"></canvas>

  <div id="hud">
    <div id="player-card" class="pill">
      <div id="avatar-badge">🎓</div>
      <div>
        <div id="lvl">Lv 1</div>
        <div class="xpbar"><div id="xpfill"></div></div>
      </div>
    </div>
    <div id="ball-chip" class="pill light"></div>
  </div>
  <div id="zone-chip" class="pill light">📍 Upper East Side</div>
  <button id="btn-sound" aria-label="Turn music off">🔊</button>
  <button id="mode-chip" class="pill light" aria-label="Play mode">🎮 Explore</button>
  <button id="online-chip" class="pill light" aria-label="Online trainers">🔒 Solo</button>
  <button id="quest-chip" class="pill light" aria-label="Quests">📜 Quests</button>
  <div id="casino-hud" class="hidden"><b>🎰 Regi Casino</b><span id="cas-candy">🍭 0</span><button id="cas-exit">🚪 Exit</button></div>
  <div id="zoom-ctl"><button id="zoom-in" aria-label="Zoom in">➕</button><button id="zoom-lvl" aria-label="Reset zoom">100%</button><button id="zoom-out" aria-label="Zoom out">➖</button></div>
  <button id="btn-chat" class="hidden" aria-label="Chat">💬</button>
  <div id="chat" class="hidden">
    <div class="chat-head"><b>💬 Trainer chat</b><button id="chat-close" aria-label="Close chat">✕</button></div>
    <div id="chat-log"></div>
    <div id="chat-emotes"></div>
    <div class="chat-row"><input id="chat-input" maxlength="120" placeholder="Say something nice…" autocomplete="off"><button id="chat-send">Send</button></div>
  </div>

  <div id="nearby"><div class="nearby-title">Nearby</div><div id="nearby-list"></div></div>

  <nav id="dock">
    <button id="btn-dex" aria-label="Regidex"><span class="ico">📖</span><span class="lbl">Regidex</span></button>
    <button id="btn-league" aria-label="Battle League"><span class="ico">⚔️</span><span class="lbl">League</span></button>
    <button id="btn-bag" class="main" aria-label="Trainer and bag"><span class="ico">👑</span></button>
    <button id="btn-box" aria-label="My Regimon"><span class="ico">🗃️</span><span class="lbl">Caught</span></button>
    <button id="btn-map" aria-label="Open the neighborhood map"><span class="ico">🗺️</span><span class="lbl">Map</span></button>
  </nav>

  <div id="osm-credit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
  <div id="toast"></div>
  <div id="banner"></div>

  <section id="catch" class="hidden">
    <canvas id="catch-canvas"></canvas>
    <div id="catch-top">
      <div id="catch-cp"></div>
      <div id="catch-name"></div>
      <div id="catch-types"></div>
    </div>
    <div id="catch-msg"></div>
    <div id="catch-hint">Swipe the ball up to throw!</div>
    <div id="catch-bottom">
      <button id="btn-run" aria-label="Run away">🏃</button>
      <span class="spacer"></span>
      <button id="btn-ball" aria-label="Switch ball"></button>
      <button id="btn-bagel" aria-label="Give a bagel">🥯<b id="bagel-count"></b></button>
    </div>
  </section>

  <section id="battle" class="hidden">
    <div class="b-field" id="b-field">
      <div class="b-trainer" id="b-trainer"></div>
      <div class="b-foe">
        <div class="b-card">
          <div class="b-name"><span id="bf-name"></span><span class="b-lv" id="bf-lv"></span></div>
          <div class="b-types" id="bf-types"></div>
          <div class="hp"><div id="bf-hp"></div></div>
          <div class="b-meta"><span class="b-team" id="bf-team"></span><span class="b-shields" id="bf-shields"></span><span class="b-status" id="bf-status"></span></div>
        </div>
        <img id="bf-img" class="b-mon" alt="">
      </div>
      <div class="b-me">
        <img id="bm-img" class="b-mon mine" alt="">
        <div class="b-card">
          <div class="b-name"><span id="bm-name"></span><span class="b-lv" id="bm-lv"></span></div>
          <div class="b-types" id="bm-types"></div>
          <div class="hp"><div id="bm-hp"></div></div>
          <div class="b-hpnum" id="bm-hpnum"></div>
          <div class="en" title="Energy"><div id="bm-en"></div></div>
          <div class="b-meta"><span class="b-team" id="bm-team"></span><span class="b-shields" id="bm-shields"></span><span class="b-status" id="bm-status"></span></div>
        </div>
      </div>
    </div>
    <canvas id="b-fx"></canvas>
    <div class="b-panel">
      <div id="b-msg" aria-live="polite"></div>
      <div class="b-controls">
        <button class="b-charged" id="b-c0"><span class="fill"></span><b></b><small></small></button>
        <button class="b-fast" id="b-fast"><span>👊</span><small>Fast attack</small></button>
        <button class="b-charged" id="b-c1"><span class="fill"></span><b></b><small></small></button>
      </div>
      <div class="b-actions">
        <button id="b-switch">🔁 Switch</button>
        <span class="b-hint">Hold to attack · 1/2 special · S shield</span>
        <button id="b-run">🏳️ Forfeit</button>
      </div>
    </div>
    <div class="b-banner" id="b-banner"></div>
    <div class="b-overlay hidden" id="b-prompt"></div>
    <div class="b-overlay hidden" id="b-mini"></div>
    <div class="b-overlay hidden" id="b-pick"></div>
  </section>

  <section id="modal" class="hidden">
    <div class="sheet">
      <button class="close" aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </section>

  <script>
    // If an old cached copy of the game gets stuck, clear it and reload once.
    addEventListener('load', () => setTimeout(async () => {
      if (window.__rgStarted) return;
      let tried = false; try { tried = sessionStorage.getItem('rg-repair') === '1'; sessionStorage.setItem('rg-repair', '1'); } catch (e) { /* ignore */ }
      if (tried) return;
      try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) { /* ignore */ }
      try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) { /* ignore */ }
      location.reload();
    }, 12000));
  </script>
  <script src="js/osm.js?v=20"></script>
  <script src="js/geo.js?v=20"></script>
  <script src="js/data.js?v=20"></script>
  <script src="js/families.js?v=20"></script>
  <script src="js/evolutions.js?v=20"></script>
  <script src="js/dragon-art.js?v=20"></script>
  <script src="js/art.js?v=20"></script>
  <script src="js/music.js?v=20"></script>
  <script src="js/online.js?v=20"></script>
  <script src="js/cloud.js?v=20"></script>
  <script src="js/minigames.js?v=20"></script>
  <script src="js/battle.js?v=20"></script>
  <script src="js/game.js?v=20"></script>
</body>
</html>
